services:
  db:
    image: postgres:16-alpine
    container_name: janaawaaz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: janaawaaz
      POSTGRES_PASSWORD: janaawaaz
      POSTGRES_DB: janaawaaz
    ports:
      - "5432:5432"
    volumes:
      - janaawaaz-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janaawaaz -d janaawaaz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  janaawaaz-pgdata:
